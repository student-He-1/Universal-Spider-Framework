<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-labelledby="sfTitle">
  <title id="sfTitle">Universal Spider Framework — 万能爬虫框架</title>

  <style>
    /* ---------------------------------------------------------------
       纯 CSS 动画（无 JavaScript）。GitHub 会剥离 SVG 中的 script 标签，
       但保留 CSS 动画，因此作为图片嵌入 README 时仍会播放。
       静态基线为「最终可见状态」：若样式被剥离，仍是一个完整的静态 logo。
       配色取自控制台自身 web/static/css/style.css（--accent / --accent-hover）。
       雷达扫描对应该框架的「站点探测器」与监控面板。
       --------------------------------------------------------------- */

    /* 圆环由内向外展开 */
    @keyframes ringIn {
      from { opacity: 0; transform: scale(.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    .ringIn {
      transform-box: fill-box;
      transform-origin: center;
      animation: ringIn .6s cubic-bezier(.22,1,.36,1) both;
    }

    /* 中心核心 */
    @keyframes pop {
      from { opacity: 0; transform: scale(.3); }
      to   { opacity: 1; transform: scale(1); }
    }
    .pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .45s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* 扫描线 + 扇区：常驻旋转 */
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .sweep {
      transform-box: view-box;
      transform-origin: 280px 118px;
      animation: spin 4s linear infinite;
    }

    /* 光点：周期与扫描周期一致（4s），延迟按角度换算，
       使每个光点恰好在扫描线掠过时亮起 */
    @keyframes blip {
      0%   { opacity: 0;   transform: scale(.4); }
      5%   { opacity: 1;   transform: scale(1.7); }
      18%  { opacity: .85; transform: scale(1); }
      65%  { opacity: .22; transform: scale(.9); }
      100% { opacity: 0;   transform: scale(.4); }
    }
    .blip {
      transform-box: fill-box;
      transform-origin: center;
      animation: blip 4s ease-out infinite normal backwards;
    }

    /* 字标：遮罩横向擦除显现 */
    @keyframes wipe { from { transform: translateX(-560px); } to { transform: translateX(0); } }
    .wipeRect {
      transform-box: view-box;
      animation: wipe .95s cubic-bezier(.65,0,.35,1) 2.2s both;
    }

    /* 分隔线：从中心向两侧展开 */
    @keyframes ruleIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .rule {
      transform-box: view-box;
      transform-origin: 280px 276px;
      animation: ruleIn .6s cubic-bezier(.22,1,.36,1) 2.9s both;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fadeIn { animation: fadeIn .6s ease-out both; }

    @media (prefers-reduced-motion: reduce) {
      .ringIn, .pop, .sweep, .blip, .wipeRect, .rule, .fadeIn { animation: none !important; }
    }
  </style>

  <defs>
    <mask id="sfWipe">
      <rect class="wipeRect" x="0" y="0" width="560" height="336" fill="#fff"/>
    </mask>
  </defs>

  <!-- ============ 上半部分：雷达扫描 ============ -->

  <!-- 十字准线 -->
  <g class="fadeIn" style="animation-delay:.65s" stroke="#0891B2" stroke-width="1" opacity=".22">
    <line x1="196" y1="118" x2="364" y2="118"/>
    <line x1="280" y1="34"  x2="280" y2="202"/>
  </g>

  <!-- 刻度圆环（外 → 内） -->
  <g fill="none" stroke="#0891B2">
    <circle class="ringIn" cx="280" cy="118" r="84" stroke-width="1.6" opacity=".55" style="animation-delay:0s"/>
    <circle class="ringIn" cx="280" cy="118" r="56" stroke-width="1.3" opacity=".4"  style="animation-delay:.25s"/>
    <circle class="ringIn" cx="280" cy="118" r="28" stroke-width="1.1" opacity=".28" style="animation-delay:.45s"/>
  </g>

  <!-- 扫描扇区 + 扫描线 -->
  <g class="sweep">
    <path d="M 280 118 L 280 34 A 84 84 0 0 0 238 45.2 Z" fill="#22D3EE" opacity=".13"/>
    <line x1="280" y1="118" x2="280" y2="34" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 捕获到的目标光点：延迟 = 扫描线转过的角度 / 360 × 4s -->
  <g fill="#67E8F9">
    <circle class="blip" cx="338.9" cy="84"    r="3.5" style="animation-delay:.667s"/>
    <circle class="blip" cx="306"   cy="189.4" r="3.5" style="animation-delay:1.778s"/>
    <circle class="blip" cx="229.3" cy="136.5" r="3.5" style="animation-delay:2.778s"/>
    <circle class="blip" cx="232.5" cy="78.1"  r="3.5" style="animation-delay:3.444s"/>
  </g>

  <!-- 中心核心 -->
  <circle class="pop" cx="280" cy="118" r="6" fill="#22D3EE" style="animation-delay:.85s"/>

  <!-- ============ 下半部分：字标（居中） ============ -->

  <g mask="url(#sfWipe)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
     font-size="28" text-anchor="start" fill="#0891B2">
    <text x="145.6" y="258" font-weight="700">UNIVERSAL</text>
    <text x="313.6" y="258" font-weight="400" opacity=".72">SPIDER</text>
  </g>

  <line class="rule" x1="145.6" y1="276" x2="414.4" y2="276"
        stroke="#0891B2" stroke-width="1" opacity=".35"/>

  <text class="fadeIn" x="183" y="300"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="13" fill="#64748B" textLength="194" lengthAdjust="spacing"
        style="animation-delay:3.10s">CONFIG-DRIVEN ENGINE</text>
</svg>
