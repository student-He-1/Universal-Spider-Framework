version: "3.8"

services:
  # ==================== Redis：去重 + 分布式队列 ====================
  redis:
    image: redis:7-alpine
    container_name: spider-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== PostgreSQL：原始(JSONB) + 清洗后(结构化) ====================
  postgres:
    image: postgres:16-alpine
    container_name: spider-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spider
      POSTGRES_PASSWORD: spider123
      POSTGRES_DB: spider_data
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider -d spider_data"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Prometheus：指标采集 ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: spider-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - redis

  # ==================== Grafana：可视化面板 ====================
  grafana:
    image: grafana/grafana:latest
    container_name: spider-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis_data:
  pg_data:
  prom_data:
  grafana_data:
